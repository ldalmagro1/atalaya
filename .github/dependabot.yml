# Como máximo un PR semanal por ecosistema, que junta todas las actualizaciones.
# Las correcciones de seguridad llegan cuando hay una alerta, sin esperar a la frecuencia semanal.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencias
    ignore:
      # Las versiones mayores de npm se deciden en una historia (ver DECISIONES.md).
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Fijadas a propósito para que el lockfile sirva en Linux (ATAL-22).
      - dependency-name: '@emnapi/*'
    groups:
      menores:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      seguridad-menores:
        applies-to: security-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencias
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
      seguridad-menores:
        applies-to: security-updates
        update-types:
          - minor
          - patch
